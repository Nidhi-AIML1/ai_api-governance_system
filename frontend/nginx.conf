server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker ka internal DNS: "backend" naam ko backend container ke address mein badalta hai
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Browser "/api/..." maangta hai, nginx use backend container ko "/..." bana ke bhej deta hai
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # Baaki sab kuch dashboard (React) ka hai
    location / {
        try_files $uri $uri/ /index.html;
    }
}